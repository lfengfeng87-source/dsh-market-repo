name: Refresh market index

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0 点（北京时间 8 点）
  workflow_dispatch: {} # 允许手动触发

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh index
        env:
          GITHUB_TOKEN: ${{ secrets.MARKET_GH_TOKEN || github.token }}
          PER_BOARD: '200'
        run: node scripts/refresh.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add public/market.json cache/metrics.json src/seed.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "refresh: $(date -u +%Y-%m-%d) market index rebuild"
            git push
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: false
          keep_files: false
